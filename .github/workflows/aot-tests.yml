name: AOT translator tests

# Runs only on demand: a manual run, or a push whose commit message says [build].
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # only to publish failure logs to the ci-logs branch (job logs are not readable from the dev sandbox)

concurrency:
  group: aot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # x86-64: every case runs natively and translated; the two states must match.
  differential-x86:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Tools
        run: sudo apt-get install -y --no-install-recommends ninja-build
      - name: Build cache (Zydis)
        uses: actions/cache@v4
        with:
          path: build/vpaot
          key: vpaot-x86-${{ hashFiles('third_party/zydis/**', 'tools/vpaot/**') }}
      - name: Build vpaot
        run: cmake -S tools/vpaot -B build/vpaot -G Ninja && ninja -C build/vpaot
      - name: Differential tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/logs
          grep -m1 "model name" /proc/cpuinfo | tee build/logs/cpu.txt
          python3 tests/aot/run.py --write-golden 2>&1 | tee build/logs/differential-x86.txt
      - name: Whole program through the ELF path
        run: tests/aot/program/run.sh
      - name: Missing entries logged and fed back with --roots
        run: tests/aot/roots/run.sh
      - name: Locked operations under contention
        run: tests/aot/atomics/run.sh
      - name: C++ exceptions (static libsupc++ + libgcc_eh, translated whole)
        run: tests/aot/exceptions/run.sh
      - name: A real library at scale (libstdc++ translated whole, every unit compiled)
        env:
          CC: clang
        run: tests/aot/realbin/run.sh
      - name: Loader and imports
        run: tests/aot/loader/run.sh
      - name: Two modules, attach by fingerprint
        run: tests/aot/modules/run.sh
      - name: shadPS4-style AOT guest engine
        run: tests/shadps4/run.sh
      - name: Publish logs and the AMD goldens (ci-logs branch)
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci-logs/golden && cp -r build/logs/. /tmp/ci-logs/ 2>/dev/null || true
          cp tests/aot/golden/*.txt /tmp/ci-logs/golden/ 2>/dev/null || true
          cd /tmp/ci-logs
          git init -q && git checkout -q -b ci-logs
          git -c user.name=VPEngine-CI -c user.email=ci@vpengine.invalid add -A
          git -c user.name=VPEngine-CI -c user.email=ci@vpengine.invalid commit -qm "logs ${GITHUB_SHA::7} ${GITHUB_JOB}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs:ci-logs-${GITHUB_JOB}
      - name: Golden files
        uses: actions/upload-artifact@v4
        with:
          name: golden
          path: tests/aot/golden/*.txt

  # arm64: the translated C runs on ARM and must reproduce the x86 golden states.
  translated-arm64:
    needs: differential-x86
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Tools
        run: sudo apt-get install -y --no-install-recommends ninja-build binutils-x86-64-linux-gnu gcc-x86-64-linux-gnu g++-x86-64-linux-gnu
      - name: Golden files from the x86 job
        uses: actions/download-artifact@v4
        with:
          name: golden
          path: tests/aot/golden
      - name: Build cache (Zydis)
        uses: actions/cache@v4
        with:
          path: build/vpaot
          key: vpaot-arm64-${{ hashFiles('third_party/zydis/**', 'tools/vpaot/**') }}
      - name: Build vpaot
        run: cmake -S tools/vpaot -B build/vpaot -G Ninja && ninja -C build/vpaot
      - name: Translated tests against the goldens
        env:
          AS: x86_64-linux-gnu-as
          LD: x86_64-linux-gnu-ld
          OBJCOPY: x86_64-linux-gnu-objcopy
          NM: x86_64-linux-gnu-nm
        run: python3 tests/aot/run.py
      - name: Whole program through the ELF path (guest built with the x86 cross tools)
        env:
          AS: x86_64-linux-gnu-as
          LD: x86_64-linux-gnu-ld
          XCC: x86_64-linux-gnu-gcc
        run: tests/aot/program/run.sh
      - name: Loader and imports (guest built with the x86 cross tools)
        env:
          AS: x86_64-linux-gnu-as
          LD: x86_64-linux-gnu-ld
          XCC: x86_64-linux-gnu-gcc
        run: tests/aot/loader/run.sh
      - name: Two modules (guest built with the x86 cross tools)
        env:
          AS: x86_64-linux-gnu-as
          LD: x86_64-linux-gnu-ld
          XCC: x86_64-linux-gnu-gcc
          NM: x86_64-linux-gnu-nm
        run: tests/aot/modules/run.sh
      - name: shadPS4-style AOT guest engine (guest built with the x86 cross tools)
        env:
          LD: x86_64-linux-gnu-ld
          XCC: x86_64-linux-gnu-gcc
          NM: x86_64-linux-gnu-nm
        run: tests/shadps4/run.sh
      - name: Missing entries fed back with --roots (guest built with the x86 cross tools)
        env:
          AS: x86_64-linux-gnu-as
          LD: x86_64-linux-gnu-ld
          XCC: x86_64-linux-gnu-gcc
        run: tests/aot/roots/run.sh
      - name: Locked operations under contention on ARM (split locks included)
        env:
          AS: x86_64-linux-gnu-as
          LD: x86_64-linux-gnu-ld
          OBJCOPY: x86_64-linux-gnu-objcopy
        run: tests/aot/atomics/run.sh
      - name: C++ exceptions on ARM (guest built with the x86 cross tools)
        env:
          AS: x86_64-linux-gnu-as
          XCC: x86_64-linux-gnu-gcc
          XCXX: x86_64-linux-gnu-g++
        run: tests/aot/exceptions/run.sh
